  #     - user-service
  #     - song-service
  # --- SONG SERVICE ---
  song-service:
    build:
      context: ./song_service
      dockerfile: Dockerfile
    container_name: song_container
    ports:
      - "3500:3500" # Map to your Song Service port
    env_file:
      - ./song_service/.env
    environment:
      - NODE_ENV=development

  # --- REVIEW SERVICE ---
  review-service1:
    build:
      context: ./review_service
      dockerfile: Dockerfile
    container_name: review_container1
    ports:
      - "3000:3000" # Your existing mapping
    env_file:
      - ./review_service/.env
    environment:
      - App_Name=review1
      - NODE_ENV=development

  review-service2:
    build:
      context: ./review_service
      dockerfile: Dockerfile
    container_name: review_container2
    ports:
      - "3002:3000" # Your existing mapping
    env_file:
      - ./review_service/.env
    environment:
      - App_Name=review2
      - NODE_ENV=development

  review-service3:
    build:
      context: ./review_service
      dockerfile: Dockerfile
    container_name: review_container3
    ports:
      - "3004:3000" # Your existing mapping
    env_file:
      - ./review_service/.env
    environment:
      - App_Name=review3
      - NODE_ENV=development        