services:
  # --- USER SERVICE ---
  user-service:
    build:
      context: ./user_service
      dockerfile: Dockerfile
    container_name: user_container
    ports:
      - "4500:4500" # Map to your User Service port
    env_file:
      - ./user_service/.env
    environment:
      - App_name=user_service
      - NODE_ENV=development
 

      # ATLAS_URI is pulled from the .env file
   #--- getway service----   
  # gateway:
  #   build: ./gateway
  #   ports:
  #     - "80:80"
