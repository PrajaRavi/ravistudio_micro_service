services:
  # --- USER SERVICE ---
  user-service1:
    build:
      context: ./user_service
      dockerfile: Dockerfile
    container_name: user_container1
    ports:
      - "4500:4500" # Map to your User Service port
    env_file:
      - ./user_service/.env
    environment:
      - App_name=user_service1
      - NODE_ENV=development
  user-service2:
    build:
      context: ./user_service
      dockerfile: Dockerfile
    container_name: user_container2
    ports:
      - "4501:4500" # Map to your User Service port
    env_file:
      - ./user_service/.env
    environment:
      - App_name=user_service2
      - NODE_ENV=development    
  user-service3:
    build:
      context: ./user_service
      dockerfile: Dockerfile
    container_name: user_container3
    ports:
      - "4502:4500" # Map to your User Service port
    env_file:
      - ./user_service/.env
    environment:
      - App_name=user_service3
      - NODE_ENV=development    
 

   
  # --- SONG SERVICE ---
  song-service:
    build:
      context: ./song_service
      dockerfile: Dockerfile
    container_name: song_container
    ports:
      - "3500:3500" # Map to your Song Service port
    env_file:
      - ./song_service/.env
    environment:
      - NODE_ENV=development

  # --- REVIEW SERVICE ---
  review-service1:
    build:
      context: ./review_service
      dockerfile: Dockerfile
    container_name: review_container1
    ports:
      - "3000:3000" # Your existing mapping
    env_file:
      - ./review_service/.env
    environment:
      - App_Name=review1
      - NODE_ENV=development

